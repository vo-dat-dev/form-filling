services:
  ocr:
    build: ./ocr
    restart: unless-stopped
    ports:
      - "8091:8091"

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: form_filling
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
